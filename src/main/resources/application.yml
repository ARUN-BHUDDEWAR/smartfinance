spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/budget_tracker_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://smartfinance-d4cv.vercel.app}"
  demo-data:
    enabled: "${DEMO_DATA_ENABLED:true}"
    password: "${DEMO_USER_PASSWORD:}"
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: "${JWT_EXPIRATION_MS:900000}"
